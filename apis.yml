name: Masergy
description: >-
  Masergy Communications was a managed networking and security provider offering
  software-defined networking (SD-WAN), secure networking (SASE), managed
  security services, and unified communications as a service (UCaaS/CCaaS) to
  enterprises over a global software-defined platform. Masergy was acquired by
  Comcast Business in October 2021 and folded into Comcast Business; the
  masergy.com web properties now redirect to business.comcast.com/masergy/.
  Added to the API Evangelist network as a portfolio company of
  lightspeed-venture-partners. Enrichment found no live standalone developer
  portal or API surface (api.masergy.com returns HTTP 502; developer/docs
  subdomains do not resolve), so this profile documents identity and the
  probed domain-security posture only.
